# Observabilité en développement local : VictoriaLogs + Vector.
#
#   npm run observability:dev        # démarre
#   npm run observability:dev:down   # arrête (les logs indexés sont conservés)
#
# Vector lit `api/logs`, que l'API écrit quand elle tourne sur la machine
# (`npm run dev`). Dans `api/.env`, définir `OBSERVABILITY_URL=http://localhost:9428`
# et `DEMO_MODE=false` : le mode démonstration coupe volontairement les journaux.
name: lxp-observability-dev

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=7d
      - -http.pathPrefix=/v1/observability
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - vlogs:/vlogs

  vector:
    image: timberio/vector:0.62.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - victorialogs
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ../../api/logs:/logs:ro
      - vector:/var/lib/vector

volumes:
  vlogs:
  vector:
