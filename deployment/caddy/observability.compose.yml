# Observabilité, superposée au socle `compose.yml` (et à `ai.compose.yml`) :
#
#   docker compose -f compose.yml -f observability.compose.yml up -d
#
# - VictoriaLogs + Vector : logs applicatifs (qui s'est connecté, quelles
#   routes, quels statuts), lus depuis le dossier de logs de l'application.
#   L'interface est servie par l'API sur /v1/observability/select/vmui/,
#   réservée au compte root.
# - Metabase : exploration des données métier (PostgreSQL et MongoDB) avec un
#   compte en lecture seule. Son état est stocké dans `db-metabase`.
#
# Ce fichier n'est pas autonome : il réutilise `app` et le réseau `backend`.

services:
  app:
    environment:
      OBSERVABILITY_URL: http://victorialogs:9428
    networks:
      - observability

  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-victorialogs
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      # 30 jours : limite la durée de conservation des IP et identifiants.
      - -retentionPeriod=30d
      # Préfixe commun avec la route de l'API : l'interface n'est servie qu'à
      # travers `/v1/observability`, réservée au compte root.
      - -http.pathPrefix=/v1/observability
    volumes:
      - vlogs:/vlogs
    # Aucun port publié ni label de proxy : VictoriaLogs n'est joignable que
    # depuis le réseau interne `observability` (API et Vector).
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  vector:
    image: timberio/vector:0.62.0-alpine
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - victorialogs
    volumes:
      - ${DEPLOY_PATH:?Set DEPLOY_PATH}/observability/vector.yaml:/etc/vector/vector.yaml:ro
      - ${DEPLOY_PATH:?Set DEPLOY_PATH}/logs:/logs:ro
      - vector:/var/lib/vector
    networks:
      - observability
    environment:
      VECTOR_WATCH_CONFIG: "false"
    security_opt:
      - no-new-privileges:true

  db-metabase:
    image: postgres:18-alpine
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-db-metabase
    restart: unless-stopped
    volumes:
      - pg_metabase:/var/lib/postgresql
    networks:
      - observability
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD}
      POSTGRES_DB: metabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  metabase:
    image: metabase/metabase:v0.55.1
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-metabase
    restart: unless-stopped
    depends_on:
      db-metabase:
        condition: service_healthy
    networks:
      - caddy
      - backend
      - observability
    labels:
      caddy: "http://${METABASE_HOST:?Set METABASE_HOST}"
      caddy.reverse_proxy: "${LXP_DEPLOYMENT_NAME:-lxp}-metabase:3000"
      caddy_ingress_network: "caddy"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db-metabase
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    security_opt:
      - no-new-privileges:true

networks:
  # Réseau propre à l'observabilité : VictoriaLogs, Vector et la base de Metabase n'ont
  # aucune raison d'être joignables depuis `backend`.
  observability:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_observability
    internal: true

volumes:
  vlogs:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_vlogs
  vector:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_vector
  pg_metabase:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_pg_metabase
