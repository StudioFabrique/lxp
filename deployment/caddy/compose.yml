name: ${LXP_DEPLOYMENT_NAME:-lxp}

services:
  app:
    image: "${LXP_IMAGE:-studiostep/lxp}:${LXP_IMAGE_TAG:-latest}"
    pull_policy: always
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-app
    restart: unless-stopped
    init: true
    expose:
      - "${PORT:?Set PORT in APP_ENV}"
    depends_on:
      db-pg:
        condition: service_healthy
      db-mongo:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - ${DEPLOY_PATH:?Set DEPLOY_PATH}/uploads:/app/api/dist/uploads
      - ${DEPLOY_PATH}/logs:/app/api/dist/logs
    networks:
      - caddy
      - backend
    labels:
      caddy: "http://${DEV_APP_HOST:?Set DEV_APP_HOST}"
      caddy.import: "dev_access"
      caddy.reverse_proxy: "${LXP_DEPLOYMENT_NAME:-lxp}-app:${PORT}"
      caddy.reverse_proxy.header_up_0: "X-Forwarded-Proto {http.request.header.X-Forwarded-Proto}"
      caddy.reverse_proxy.header_up_1: "X-Forwarded-For {http.request.header.X-Forwarded-For}"
      caddy_ingress_network: "caddy"

      homepage.group: "Applications"
      homepage.name: "LXP"
      homepage.href: "https://${DEV_APP_HOST}"
      homepage.description: "Plateforme de formation LXP"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_LOCAL_URL: ${MONGO_LOCAL_URL}

      DOCKER_IA_API_BASE_URL: ${DOCKER_IA_API_BASE_URL}
      DOCKER_IA_AUTH_SECRET: ${DOCKER_IA_AUTH_SECRET}

      SECRET: ${SECRET}
      REGISTER_SECRET: ${REGISTER_SECRET}

      ENVIRONMENT: ${ENVIRONMENT}
      FRONT_URL: ${FRONT_URL}
      PORT: ${PORT}

      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      SMTP: ${SMTP}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PORT: ${SMTP_PORT}
      FROM: ${FROM}

      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: "${LXP_AI_IMAGE:-studiostep/lxp-ai}:${LXP_AI_IMAGE_TAG:-latest}"
    pull_policy: always
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-ai
    restart: unless-stopped
    depends_on:
      db-pg:
        condition: service_healthy
      db-ai:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - backend
      - egress
    volumes:
      - hf_cache:/cache
      - ${DEPLOY_PATH:?Set DEPLOY_PATH}/data:/app/data
      - ${DEPLOY_PATH}/uploads/activities:/lxp/api/uploads/activities:ro
    environment:
      DATABASE_URL: ${ANDRIA_AI_DB_URL}
      ANDRIA_AI_DB_URL: ${ANDRIA_AI_DB_URL}
      LXP_DB_URL: ${LXP_DB_URL}

      LXP_UPLOADS_DIR: /lxp/api/uploads/activities
      LXP_PUBLIC_BASE: ${LXP_PUBLIC_BASE}

      SECRET_KEY: ${SECRET_KEY}
      DEV_BYPASS_AUTH: "false"

      MISTRAL_STUDENT_API_KEY: ${MISTRAL_STUDENT_API_KEY}
      MISTRAL_CONTENT_API_KEY: ${MISTRAL_CONTENT_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}

      QUIZ_TEMPERATURE: ${QUIZ_TEMPERATURE:-0.5}
      QUIZ_MAX_TOKENS: ${QUIZ_MAX_TOKENS:-1200}
      QUIZ_MAX_ATTEMPTS: ${QUIZ_MAX_ATTEMPTS:-3}
      QUIZ_PARALLEL_SLOTS: ${QUIZ_PARALLEL_SLOTS:-3}
      QUIZ_MIN_PROMPT_LEN: ${QUIZ_MIN_PROMPT_LEN:-12}
      QUIZ_MIN_EXPLANATION_LEN: ${QUIZ_MIN_EXPLANATION_LEN:-10}

      DB_INGEST_MIN_WORDS: ${DB_INGEST_MIN_WORDS:-20}

      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence_transformers
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-pg:
    image: postgres:18-alpine
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-db-pg
    restart: unless-stopped
    volumes:
      - pg:/var/lib/postgresql
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  db-ai:
    image: pgvector/pgvector:pg18
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-db-ai
    restart: unless-stopped
    volumes:
      - pg_ai:/var/lib/postgresql
    networks:
      - backend
    environment:
      POSTGRES_USER: ${ANDRIA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ANDRIA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ANDRIA_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  db-mongo:
    image: mongo:8.2
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-db-mongo
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    networks:
      - backend
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  caddy:
    external: true
  backend:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_backend
    internal: true
  egress:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_egress

volumes:
  pg:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_pg
  pg_ai:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_pg_ai
  mongo:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_mongo
  hf_cache:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_hf_cache
