# Surcouche du mode `caddy`, superposée au socle `../compose.yml` :
#
#   docker compose -f compose.yml -f caddy/compose.yml up -d
#
# Le socle décrit l'application et ses bases ; ce fichier ne contient que ce qui
# change derrière le proxy partagé : pas de port publié sur l'hôte, un réseau
# `caddy` pour le proxy, ses labels, et un réseau `backend` interne.

services:
  app:
    # Aucun port publié : seul Caddy expose l'application.
    expose:
      - "${PORT:?Set PORT}"
    networks:
      - caddy
    labels:
      caddy: "http://${APP_HOST:?Set APP_HOST}"
      caddy.reverse_proxy: "${LXP_DEPLOYMENT_NAME:-lxp}-app:${PORT}"
      caddy.reverse_proxy.header_up_0: "X-Forwarded-Proto {http.request.header.X-Forwarded-Proto}"
      caddy.reverse_proxy.header_up_1: "X-Forwarded-For {http.request.header.X-Forwarded-For}"
      caddy_ingress_network: "caddy"

      homepage.group: "Applications"
      homepage.name: "LXP"
      homepage.href: "https://${APP_HOST}"
      homepage.description: "Plateforme de formation LXP"

networks:
  caddy:
    external: true
  backend:
    # Aucune sortie vers l'extérieur : voir `ai.compose.yml` pour l'IA.
    internal: true
