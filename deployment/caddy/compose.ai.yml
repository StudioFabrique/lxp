# Couche IA, superposée au socle `compose.yml` :
#
#   docker compose -f compose.yml -f compose.ai.yml up -d app
#
# Ce fichier n'est pas autonome : il complète des services et référence des
# réseaux déclarés par le socle. Il n'est pas chargé sur l'instance de
# démonstration, où `DEMO_MODE=true` coupe déjà l'IA côté applicatif.

services:
  app:
    depends_on:
      ai:
        condition: service_healthy
    environment:
      DOCKER_IA_API_BASE_URL: ${DOCKER_IA_API_BASE_URL:?Set DOCKER_IA_API_BASE_URL}
      DOCKER_IA_AUTH_SECRET: ${DOCKER_IA_AUTH_SECRET:?Set DOCKER_IA_AUTH_SECRET}
      DISABLE_AI_FEATURES: ${DISABLE_AI_FEATURES:-false}

  ai:
    image: "${LXP_AI_IMAGE:-studiostep/lxp-ai}:${LXP_AI_IMAGE_TAG:-latest}"
    pull_policy: always
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-ai
    restart: unless-stopped
    depends_on:
      db-pg:
        condition: service_healthy
      db-ai:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - backend
      - egress
    volumes:
      - hf_cache:/cache
      - ${DEPLOY_PATH:?Set DEPLOY_PATH}/data:/app/data
      - ${DEPLOY_PATH}/uploads/activities:/lxp/api/uploads/activities:ro
    environment:
      DATABASE_URL: ${ANDRIA_AI_DB_URL:?Set ANDRIA_AI_DB_URL}
      ANDRIA_AI_DB_URL: ${ANDRIA_AI_DB_URL:?Set ANDRIA_AI_DB_URL}
      LXP_DB_URL: ${LXP_DB_URL:?Set LXP_DB_URL}

      LXP_UPLOADS_DIR: /lxp/api/uploads/activities
      LXP_PUBLIC_BASE: ${LXP_PUBLIC_BASE}

      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DEV_BYPASS_AUTH: "false"

      MISTRAL_STUDENT_API_KEY: ${MISTRAL_STUDENT_API_KEY:?Set MISTRAL_STUDENT_API_KEY}
      MISTRAL_CONTENT_API_KEY: ${MISTRAL_CONTENT_API_KEY:?Set MISTRAL_CONTENT_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}

      QUIZ_TEMPERATURE: ${QUIZ_TEMPERATURE:-0.5}
      QUIZ_MAX_TOKENS: ${QUIZ_MAX_TOKENS:-1200}
      QUIZ_MAX_ATTEMPTS: ${QUIZ_MAX_ATTEMPTS:-3}
      QUIZ_PARALLEL_SLOTS: ${QUIZ_PARALLEL_SLOTS:-3}
      QUIZ_MIN_PROMPT_LEN: ${QUIZ_MIN_PROMPT_LEN:-12}
      QUIZ_MIN_EXPLANATION_LEN: ${QUIZ_MIN_EXPLANATION_LEN:-10}

      DB_INGEST_MIN_WORDS: ${DB_INGEST_MIN_WORDS:-20}

      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence_transformers
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      # Une instance neuve doit d'abord remplir le cache Hugging Face et peut
      # mettre plusieurs minutes avant d'exposer /health.
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-ai:
    image: pgvector/pgvector:pg18
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-db-ai
    restart: unless-stopped
    volumes:
      - pg_ai:/var/lib/postgresql
    networks:
      - backend
    environment:
      POSTGRES_USER: ${ANDRIA_POSTGRES_USER:?Set ANDRIA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ANDRIA_POSTGRES_PASSWORD:?Set ANDRIA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ANDRIA_POSTGRES_DB:?Set ANDRIA_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  egress:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_egress

volumes:
  pg_ai:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_pg_ai
  hf_cache:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_hf_cache
