# Surcouche IA du mode `caddy`, superposée à `../ai.compose.yml` :
#
#   docker compose -f compose.yml -f ai.compose.yml \
#     -f caddy/compose.yml -f caddy/ai.compose.yml up -d app dropout-worker
#
# Le `backend` de ce mode est `internal` : sans réseau de sortie dédié, `ai` et
# `dropout-worker` ne joindraient ni Mistral ni Hugging Face. Elle doit être
# chargée après `ai.compose.yml`, qui déclare ces services.

services:
  ai:
    networks:
      - egress
  dropout-worker:
    networks:
      - egress

networks:
  egress:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_egress
