name: lxp

services:
  app:
    image: studiostep/lxp:latest
    pull_policy: always
    restart: always
    ports:
      - "80:${PORT}"
    depends_on:
      db-pg:
        condition: service_healthy
      db-mongo:
        condition: service_healthy
      ai:
        condition: service_started
    volumes:
      - /home/${SSH_USER}/${SSH_TARGET}/uploads:/app/api/dist/uploads
      - /home/${SSH_USER}/${SSH_TARGET}/logs:/app/api/dist/logs
    networks:
      - lxp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_LOCAL_URL: ${MONGO_LOCAL_URL}

      DOCKER_IA_API_BASE_URL: ${DOCKER_IA_API_BASE_URL}
      DOCKER_IA_AUTH_SECRET: ${DOCKER_IA_AUTH_SECRET}

      SECRET: ${SECRET}
      REGISTER_SECRET: ${REGISTER_SECRET}

      # Mode démonstration. Sur `true`, l'API refuse toute écriture et expose
      # l'ouverture d'une session publique. Réservé à l'instance dédiée.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_URL: ${DEMO_URL:-}
      DEMO_EXIT_URL: ${DEMO_EXIT_URL:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-}

      ENVIRONMENT: ${ENVIRONMENT}
      FRONT_URL: ${FRONT_URL}
      PORT: ${PORT}

      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      SMTP: ${SMTP}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PORT: ${SMTP_PORT}
      FROM: ${FROM}

      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: studiostep/lxp-ai:latest
    pull_policy: always
    restart: always
    depends_on:
      db-pg:
        condition: service_healthy
      db-ai:
        condition: service_healthy
    networks:
      - lxp
    volumes:
      - hf_cache:/cache
      - /home/${SSH_USER}/${SSH_TARGET}/data:/app/data

      # Même stockage que celui monté dans le conteneur LXP.
      - /home/${SSH_USER}/${SSH_TARGET}/uploads/activities:/lxp/api/uploads/activities:ro
    environment:
      # Base propre au service IA
      DATABASE_URL: ${ANDRIA_AI_DB_URL}
      ANDRIA_AI_DB_URL: ${ANDRIA_AI_DB_URL}

      # Base métier LXP, idéalement avec un utilisateur read-only
      LXP_DB_URL: ${LXP_DB_URL}

      LXP_UPLOADS_DIR: /lxp/api/uploads/activities
      LXP_PUBLIC_BASE: ${LXP_PUBLIC_BASE}

      SECRET_KEY: ${SECRET_KEY}
      DEV_BYPASS_AUTH: "false"

      MISTRAL_STUDENT_API_KEY: ${MISTRAL_STUDENT_API_KEY}
      MISTRAL_CONTENT_API_KEY: ${MISTRAL_CONTENT_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}

      QUIZ_TEMPERATURE: ${QUIZ_TEMPERATURE:-0.5}
      QUIZ_MAX_TOKENS: ${QUIZ_MAX_TOKENS:-1200}
      QUIZ_MAX_ATTEMPTS: ${QUIZ_MAX_ATTEMPTS:-3}
      QUIZ_PARALLEL_SLOTS: ${QUIZ_PARALLEL_SLOTS:-3}
      QUIZ_MIN_PROMPT_LEN: ${QUIZ_MIN_PROMPT_LEN:-12}
      QUIZ_MIN_EXPLANATION_LEN: ${QUIZ_MIN_EXPLANATION_LEN:-10}

      DB_INGEST_MIN_WORDS: ${DB_INGEST_MIN_WORDS:-20}

      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence_transformers
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-pg:
    image: postgres:18-alpine
    restart: always
    volumes:
      # PostgreSQL 18 stores its data in a major-version-specific subdirectory.
      - pg:/var/lib/postgresql
    networks:
      - lxp
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-ai:
    image: pgvector/pgvector:pg18
    restart: always
    volumes:
      # PostgreSQL 18 stores its data in a major-version-specific subdirectory.
      - pg_ai:/var/lib/postgresql
    networks:
      - lxp
    environment:
      POSTGRES_USER: ${ANDRIA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ANDRIA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ANDRIA_POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ANDRIA_POSTGRES_USER} -d ${ANDRIA_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db-mongo:
    image: mongo:8.2
    restart: always
    volumes:
      - mongo:/data/db
    networks:
      - lxp
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  lxp:
    driver: bridge

volumes:
  pg:
  pg_ai:
  mongo:
  hf_cache:
