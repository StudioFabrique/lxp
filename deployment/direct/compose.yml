name: lxp

# Socle applicatif, sans la couche IA. L'instance de démonstration se déploie
# avec ce seul fichier ; les autres y superposent `compose.ai.yml`.

services:
  app:
    image: studiostep/lxp:latest
    pull_policy: always
    restart: always
    ports:
      - "80:${PORT}"
    depends_on:
      db-pg:
        condition: service_healthy
      db-mongo:
        condition: service_healthy
    volumes:
      - /home/${SSH_USER}/${SSH_TARGET}/uploads:/app/api/dist/uploads
      - /home/${SSH_USER}/${SSH_TARGET}/logs:/app/api/dist/logs
    networks:
      - lxp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_LOCAL_URL: ${MONGO_LOCAL_URL}

      SECRET: ${SECRET}
      REGISTER_SECRET: ${REGISTER_SECRET}

      # Mode démonstration. Sur `true`, l'API refuse toute écriture et expose
      # l'ouverture d'une session publique. Réservé à l'instance dédiée.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_URL: ${DEMO_URL:-}
      DEMO_EXIT_URL: ${DEMO_EXIT_URL:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-}

      ENVIRONMENT: ${ENVIRONMENT}
      FRONT_URL: ${FRONT_URL}
      PORT: ${PORT}

      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      SMTP: ${SMTP}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PORT: ${SMTP_PORT}
      FROM: ${FROM}

      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-pg:
    image: postgres:18-alpine
    restart: always
    volumes:
      # PostgreSQL 18 stores its data in a major-version-specific subdirectory.
      - pg:/var/lib/postgresql
    networks:
      - lxp
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-mongo:
    image: mongo:8.2
    restart: always
    volumes:
      - mongo:/data/db
    networks:
      - lxp
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  lxp:
    driver: bridge

volumes:
  pg:
  mongo:
