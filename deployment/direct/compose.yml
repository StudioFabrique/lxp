name: ${LXP_DEPLOYMENT_NAME:-lxp}

# Socle applicatif, sans la couche IA. L'instance de démonstration se déploie
# avec ce seul fichier ; les autres y superposent `compose.ai.yml`.
#
# Mode `direct` : `app` publie lui-même le port 80 de l'hôte. Le réseau reste
# donc joignable depuis l'extérieur, contrairement au `backend` interne du mode
# `caddy`, où seul le proxy partagé expose l'application.

services:
  app:
    image: "${LXP_IMAGE:-studiostep/lxp}:${LXP_IMAGE_TAG:-latest}"
    pull_policy: always
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-app
    restart: unless-stopped
    init: true
    ports:
      - "80:${PORT:?Set PORT}"
    depends_on:
      db-pg:
        condition: service_healthy
      db-mongo:
        condition: service_healthy
    volumes:
      - ${DEPLOY_PATH:?Set DEPLOY_PATH}/uploads:/app/api/dist/uploads
      - ${DEPLOY_PATH}/logs:/app/api/dist/logs
    networks:
      - backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      MONGO_LOCAL_URL: ${MONGO_LOCAL_URL:?Set MONGO_LOCAL_URL}

      SECRET: ${SECRET:?Set SECRET}
      REGISTER_SECRET: ${REGISTER_SECRET:?Set REGISTER_SECRET}
      ROOT_ACTIVATION_TOKEN_TTL_MINUTES: ${ROOT_ACTIVATION_TOKEN_TTL_MINUTES:-30}

      # Mode démonstration. Sur `true`, l'API refuse toute écriture et expose
      # l'ouverture d'une session publique. Réservé à l'instance dédiée.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_URL: ${DEMO_URL:-}
      DEMO_EXIT_URL: ${DEMO_EXIT_URL:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-}

      ENVIRONMENT: ${ENVIRONMENT}
      FRONT_URL: ${FRONT_URL}
      PORT: ${PORT}

      MAILER_EMAIL: ${MAILER_EMAIL}
      MAILER_PASSWORD: ${MAILER_PASSWORD}
      MAILER_SMTP: ${MAILER_SMTP}
      MAILER_DEV_RECIPIENT: ${MAILER_DEV_RECIPIENT}
      MAILER_SMTP_PORT: ${MAILER_SMTP_PORT}
      MAILER_FROM: ${MAILER_FROM}

      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-pg:
    image: postgres:18-alpine
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-db-pg
    restart: unless-stopped
    volumes:
      # PostgreSQL 18 range ses données dans un sous-répertoire propre à la
      # version majeure.
      - pg:/var/lib/postgresql
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  db-mongo:
    image: mongo:8.2
    container_name: ${LXP_DEPLOYMENT_NAME:-lxp}-db-mongo
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    networks:
      - backend
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USERNAME:?Set MONGO_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?Set MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?Set MONGO_DATABASE}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_backend

volumes:
  pg:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_pg
  mongo:
    name: ${LXP_DEPLOYMENT_NAME:-lxp}_mongo
