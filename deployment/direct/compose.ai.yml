# Couche IA, superposée au socle `compose.yml` :
#
#   docker compose -f compose.yml -f compose.ai.yml up -d app
#
# Ce fichier n'est pas autonome : il complète des services et référence un
# réseau déclarés par le socle. Il n'est pas chargé sur l'instance de
# démonstration, où `DEMO_MODE=true` coupe déjà l'IA côté applicatif.

services:
  app:
    depends_on:
      ai:
        condition: service_started
    environment:
      DOCKER_IA_API_BASE_URL: ${DOCKER_IA_API_BASE_URL}
      DOCKER_IA_AUTH_SECRET: ${DOCKER_IA_AUTH_SECRET}

  ai:
    image: studiostep/lxp-ai:latest
    pull_policy: always
    restart: always
    depends_on:
      db-pg:
        condition: service_healthy
      db-ai:
        condition: service_healthy
    networks:
      - lxp
    volumes:
      - hf_cache:/cache
      - /home/${SSH_USER}/${SSH_TARGET}/data:/app/data

      # Même stockage que celui monté dans le conteneur LXP.
      - /home/${SSH_USER}/${SSH_TARGET}/uploads/activities:/lxp/api/uploads/activities:ro
    environment:
      # Base propre au service IA
      DATABASE_URL: ${ANDRIA_AI_DB_URL}
      ANDRIA_AI_DB_URL: ${ANDRIA_AI_DB_URL}

      # Base métier LXP, idéalement avec un utilisateur read-only
      LXP_DB_URL: ${LXP_DB_URL}

      LXP_UPLOADS_DIR: /lxp/api/uploads/activities
      LXP_PUBLIC_BASE: ${LXP_PUBLIC_BASE}

      SECRET_KEY: ${SECRET_KEY}
      DEV_BYPASS_AUTH: "false"

      MISTRAL_STUDENT_API_KEY: ${MISTRAL_STUDENT_API_KEY}
      MISTRAL_CONTENT_API_KEY: ${MISTRAL_CONTENT_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}

      QUIZ_TEMPERATURE: ${QUIZ_TEMPERATURE:-0.5}
      QUIZ_MAX_TOKENS: ${QUIZ_MAX_TOKENS:-1200}
      QUIZ_MAX_ATTEMPTS: ${QUIZ_MAX_ATTEMPTS:-3}
      QUIZ_PARALLEL_SLOTS: ${QUIZ_PARALLEL_SLOTS:-3}
      QUIZ_MIN_PROMPT_LEN: ${QUIZ_MIN_PROMPT_LEN:-12}
      QUIZ_MIN_EXPLANATION_LEN: ${QUIZ_MIN_EXPLANATION_LEN:-10}

      DB_INGEST_MIN_WORDS: ${DB_INGEST_MIN_WORDS:-20}

      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence_transformers
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-ai:
    image: pgvector/pgvector:pg18
    restart: always
    volumes:
      # PostgreSQL 18 stores its data in a major-version-specific subdirectory.
      - pg_ai:/var/lib/postgresql
    networks:
      - lxp
    environment:
      POSTGRES_USER: ${ANDRIA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ANDRIA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ANDRIA_POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ANDRIA_POSTGRES_USER} -d ${ANDRIA_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_ai:
  hf_cache:
