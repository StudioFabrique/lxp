name: lxp

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    container_name: caddy-proxy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /home/${USER}/${TARGET}/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lxp
    depends_on:
      - lxp

  db-pg:
    image: postgres:18-alpine
    restart: always
    container_name: lxp-prisma
    volumes:
      - pg:/var/lib/postgresql/data
    networks:
      - lxp
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  db-mongo:
    image: mongo:8.2
    restart: always
    container_name: lxp-mongo
    volumes:
      - mongo:/data/db
    networks:
      - lxp
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ADMIN_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ADMIN_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}

  lxp:
    image: studiostep/lxp:latest
    pull_policy: always
    volumes:
      - /home/${USER}/${TARGET}/uploads:/app/api/dist/uploads
      - /home/${USER}/${TARGET}/logs:/app/api/dist/logs
    networks:
      - lxp
    restart: always
    container_name: lxp
    depends_on:
      - db-pg
      - db-mongo
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_LOCAL_URL=${MONGO_LOCAL_URL}
      - SECRET=${SECRET}
      - EMAIL=${EMAIL}
      - PASSWORD=${PASSWORD}
      - SMTP=${SMTP}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PORT=${SMTP_PORT}
      - FROM=${FROM}
      - REGISTER_SECRET=${REGISTER_SECRET}
      - FRONT_URL=${FRONT_URL}
      - PORT=${PORT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lxp-ai:
    image: studiostep/lxp-ai:latest
    container_name: lxp-ai
    networks:
      - lxp
    restart: always
    volumes:
      - hf_cache:/cache
      - /home/${USER}/${TARGET}/data:/app/data
    environment:
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/cache/sentence_transformers

networks:
  lxp:
    driver: bridge

volumes:
  pg:
    driver: local
  mongo:
    driver: local
  hf_cache:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
