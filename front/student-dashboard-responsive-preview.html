<!doctype html>
<html lang="fr" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard étudiant responsive</title>
    <script type="module">import "./src/index.css";</script>
  </head>
  <body class="bg-base-100 p-8">
    <main class="mx-auto max-w-[1500px]">
      <div id="resume" class="flex flex-row gap-2 max-[1799px]:flex-col">
        <div id="visual" class="min-w-0 flex-1">
          <div id="card" class="relative flex h-80 items-end overflow-hidden rounded-xl bg-primary/80 p-6 font-bold text-primary-content">
            <div class="pointer-events-none absolute inset-0 flex items-end justify-end p-5">
              <button id="action" class="pointer-events-auto btn btn-primary">
                <span aria-hidden="true">▶</span>
                <span class="hidden sm:block">Reprendre</span>
              </button>
            </div>
            <div id="text-area" class="flex w-full min-w-0 flex-col gap-1 pr-20 sm:pr-60 md:pr-64 lg:pr-72">
              <p class="truncate text-lg">Cours 1 : Identification des besoins et attentes</p>
              <h1 id="title" class="min-w-0 max-w-full truncate text-2xl">
                ↳ Leçon 1 : Questionner le client pour identifier précisément tous ses besoins
              </h1>
            </div>
          </div>
        </div>
        <div id="stats" class="order-last grid w-32 shrink-0 grid-cols-1 grid-rows-4 gap-2 text-primary max-[1799px]:order-first max-[1799px]:w-full max-[1799px]:shrink max-[1799px]:grid-cols-2 max-[1799px]:grid-rows-1 sm:max-[1799px]:grid-cols-4">
          <div class="rounded-lg bg-secondary/10 p-2 text-center"><small>Diplôme</small><strong class="block">Niveau 6</strong></div>
          <div class="rounded-lg bg-secondary/10 p-2 text-center"><small>Semaines</small><strong class="block">24</strong></div>
          <div class="rounded-lg bg-secondary/10 p-2 text-center"><small>Heures</small><strong class="block">280</strong></div>
          <div class="rounded-lg bg-secondary/10 p-2 text-center"><small>Modules</small><strong class="block">12</strong></div>
        </div>
      </div>
    </main>
  </body>
</html>
