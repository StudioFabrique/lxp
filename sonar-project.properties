sonar.projectKey=StudioFabrique_lxp
sonar.organization=studiofabrique

# Fichiers générés, bundles tiers minifiés, dumps de démo et rendus vidéo :
# ils ne sont pas du code maintenu et faussent les mesures de qualité.
sonar.exclusions=brag-output/**,front/public/presentations/**,api/dumps/**,**/vite.config.js,**/vite.config.d.ts,**/*.min.js,**/dist/**,api/src/prisma/contract.json,api/src/prisma/contract.d.ts

# Les tests sont analysés comme tels, pas comme code de production.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,api/tests/**
