name: Build and deploy LXP to development

on:
  # Le lint, les types et les tests tournent sur les PR vers beta.
  pull_request:
    branches:
      - beta
  # Le build de l'image et le deploiement tournent apres le merge sur beta.
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une PR annule ses propres runs precedents, les deploiements sur beta
  # restent serialises sur un seul groupe.
  group: lxp-development-${{ github.event_name == 'pull_request' && github.head_ref || 'beta' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LXP_IMAGE: studiostep/lxp
  LXP_IMAGE_TAG: dev-${{ github.sha }}
  LXP_AI_IMAGE: studiostep/lxp-ai
  LXP_AI_IMAGE_TAG: latest
  LXP_DEPLOYMENT_NAME: lxp-dev
  DEV_APP_HOST: ${{ vars.DEV_APP_HOST || 'lxp.dev.step.eco' }}
  DEPLOY_PATH: /home/martin/lxp-dev

jobs:
  verify:
    name: Lint, types and tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the frontend dependencies
        working-directory: front
        run: npm ci

      - name: Install the API dependencies
        working-directory: api
        run: npm ci

      - name: Lint the frontend
        working-directory: front
        run: npm run lint

      - name: Typecheck the frontend
        working-directory: front
        run: npx tsc --noEmit

      # Régénère le client Prisma avant de vérifier les types : un client
      # obsolète fait échouer la vérification sur des modèles qui existent.
      - name: Typecheck the API
        working-directory: api
        run: npm run typecheck

      - name: Run the frontend tests
        working-directory: front
        run: npx vitest run

      # Démarre son propre docker compose (PostgreSQL et MongoDB), applique les
      # migrations et charge les fixtures avant de lancer Jest.
      - name: Run the API tests
        working-directory: api
        run: npm test

  image:
    name: Build and publish the LXP image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.LXP_IMAGE }}:${{ env.LXP_IMAGE_TAG }}
            ${{ env.LXP_IMAGE }}:beta
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=lxp-development
          cache-to: type=gha,mode=max,scope=lxp-development

  deploy:
    name: Deploy to the development VPS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/beta'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7

      - name: Prepare and validate deployment environment
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          set -eu

          if [ -z "$APP_ENV" ]; then
            echo "The APP_ENV secret is empty." >&2
            exit 1
          fi

          printf '%s\n' "$APP_ENV" > .env

          required_settings="
          PORT ENVIRONMENT FRONT_URL REGISTER_SECRET SECRET
          POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL
          ANDRIA_POSTGRES_USER ANDRIA_POSTGRES_PASSWORD ANDRIA_POSTGRES_DB
          ANDRIA_AI_DB_URL LXP_DB_URL
          MONGO_ADMIN_USERNAME MONGO_ADMIN_PASSWORD MONGO_DATABASE MONGO_LOCAL_URL
          DOCKER_IA_API_BASE_URL DOCKER_IA_AUTH_SECRET SECRET_KEY
          MISTRAL_STUDENT_API_KEY MISTRAL_CONTENT_API_KEY LXP_PUBLIC_BASE
          EMAIL PASSWORD SMTP SMTP_EMAIL SMTP_PORT FROM UNSPLASH_ACCESS_KEY
          "
          for setting in $required_settings; do
            if ! grep -q "^${setting}=." .env; then
              echo "APP_ENV is missing a non-empty ${setting} setting." >&2
              exit 1
            fi
          done

          {
            printf '\n# Metadonnees de deploiement ecrites par GitHub Actions\n'
            printf 'LXP_IMAGE=%s\n' "$LXP_IMAGE"
            printf 'LXP_IMAGE_TAG=%s\n' "$LXP_IMAGE_TAG"
            printf 'LXP_AI_IMAGE=%s\n' "$LXP_AI_IMAGE"
            printf 'LXP_AI_IMAGE_TAG=%s\n' "$LXP_AI_IMAGE_TAG"
            printf 'LXP_DEPLOYMENT_NAME=%s\n' "$LXP_DEPLOYMENT_NAME"
            printf 'DEV_APP_HOST=%s\n' "$DEV_APP_HOST"
            printf 'DEPLOY_PATH=%s\n' "$DEPLOY_PATH"
          } >> .env
          chmod 600 .env

          # Le compose est deploye a la racine du repertoire cible pour que
          # `docker compose ps|exec|logs` fonctionne sans option sur le VPS.
          cp deployment/caddy/compose.yml compose.yml

          docker compose config --quiet

      - name: Copy deployment files to the VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: ".env,compose.yml,api/src/scripts/andria_notify_triggers.sql,api/uploads"
          target: "/home/martin/lxp-dev"

      - name: Pull, migrate, and start LXP
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 15m
          script: |
            set -eu
            cd /home/martin/lxp-dev

            chmod 600 .env
            rm -rf .deploy.env deployment
            mkdir -p data uploads logs
            cp -R api/uploads/. uploads/

            docker network inspect caddy >/dev/null

            docker compose config --quiet
            printf '%s' "$REGISTRY_TOKEN" | docker login --username "$REGISTRY_USER" --password-stdin
            docker compose pull

            docker compose run --rm --no-deps ai python -c \
              'import app.db_provision; print("Module app.db_provision disponible")'

            docker compose up -d db-pg db-ai db-mongo

            until docker compose exec -T db-pg sh -c \
              'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            do
              sleep 2
            done

            until docker compose exec -T db-ai sh -c \
              'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            do
              sleep 2
            done

            docker compose run --rm --no-deps -w /app/api app npx prisma migrate deploy

            docker compose exec -T db-pg sh -c \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
              < api/src/scripts/andria_notify_triggers.sql

            docker compose run --rm ai python -m app.db_provision
            docker compose up -d --remove-orphans --wait --wait-timeout 240 ai app
            docker compose exec -T app npm run generate-activation-key
            docker compose ps
