name: Build and deploy LXP to development

on:
  # Le lint, les types et les tests tournent sur les PR vers beta.
  pull_request:
    branches:
      - beta
  # Le build de l'image et le deploiement tournent apres le merge sur beta.
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag dev-<sha> existant à redéployer sans reconstruire l'image"
        required: false
        type: string

permissions:
  contents: read
  # Signature du jeton d'identite presente a Infisical. Sans elle,
  # l'authentification OIDC echoue et aucun secret n'est recupere.
  id-token: write

concurrency:
  # Une PR annule ses propres runs precedents, les deploiements sur beta
  # restent serialises sur un seul groupe.
  group: lxp-development-${{ github.event_name == 'pull_request' && github.head_ref || 'beta' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Le préfixe protège les métadonnées calculées par le workflow. `deploy.sh`
  # les restaure après l'injection Infisical, avant d'appeler Compose.
  PIPELINE_LXP_IMAGE: studiostep/lxp
  PIPELINE_LXP_IMAGE_TAG: ${{ inputs.image_tag || format('dev-{0}', github.sha) }}
  PIPELINE_LXP_AI_IMAGE: studiostep/lxp-ai
  PIPELINE_LXP_AI_IMAGE_TAG: latest
  PIPELINE_LXP_DEPLOYMENT_NAME: lxp-dev
  PIPELINE_APP_HOST: ${{ vars.APP_HOST || 'lxp.dev.step.eco' }}

jobs:
  verify:
    name: Lint, types and tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the frontend dependencies
        working-directory: front
        run: npm ci

      - name: Install the API dependencies
        working-directory: api
        run: npm ci

      - name: Lint the frontend
        working-directory: front
        run: npm run lint

      - name: Typecheck the frontend
        working-directory: front
        run: npx tsc --noEmit

      # Régénère le client Prisma avant de vérifier les types : un client
      # obsolète fait échouer la vérification sur des modèles qui existent.
      - name: Typecheck the API
        working-directory: api
        run: npm run typecheck

      - name: Run the frontend tests
        working-directory: front
        run: npx vitest run

      # Démarre son propre docker compose (PostgreSQL et MongoDB), applique les
      # migrations et charge les fixtures avant de lancer Jest.
      - name: Run the API tests
        working-directory: api
        run: npm test

      - name: Validate deployment scripts
        run: ./deployment/tests/backup-scripts.test.sh

  image:
    name: Build and publish the LXP image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/beta' && inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Charger les acces au registre
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /ci
          domain: https://eu.infisical.com

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.PIPELINE_LXP_IMAGE }}:${{ env.PIPELINE_LXP_IMAGE_TAG }}
            ${{ env.PIPELINE_LXP_IMAGE }}:beta
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=lxp-development
          cache-to: type=gha,mode=max,scope=lxp-development

  deploy:
    name: Deploy to the development VPS
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/beta' && (needs.image.result == 'success' || needs.image.result == 'skipped')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7

      - name: Valider le tag demande
        if: inputs.image_tag != ''
        run: |
          set -eu
          if ! printf '%s' "$PIPELINE_LXP_IMAGE_TAG" | grep -Eq '^dev-[0-9a-f]{40}$'; then
            echo "Le tag de retour arriere doit respecter dev-<sha Git complet>." >&2
            exit 1
          fi

      # `/ci` porte uniquement les identifiants du registre. `/runtime` porte
      # la configuration applicative et l'acces SSH. `/backup` porte les
      # secrets Restic et S3 utilises par les deux sauvegardes du deploiement.
      - name: Charger les acces au registre
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /ci
          domain: https://eu.infisical.com

      - name: Charger la configuration d'execution
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /runtime
          domain: https://eu.infisical.com

      - name: Charger la configuration de sauvegarde
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /backup
          domain: https://eu.infisical.com

      # Signale un ancien APP_ENV importe tel quel. `deploy.sh` protège aussi
      # ces valeurs, mais une clé mal classée doit être retirée d'Infisical.
      - name: Verifier le classement des secrets
        run: |
          set -eu

          reserved="
          DEPLOY_MODE DEPLOY_PATH LXP_DEPLOYMENT_NAME
          LXP_IMAGE LXP_IMAGE_TAG LXP_AI_IMAGE LXP_AI_IMAGE_TAG
          APP_HOST COMPOSE_WAIT_TIMEOUT DEPLOY_PRUNE CADDY_NETWORK
          "

          for name in $reserved; do
            eval "is_set=\${$name+x}"
            if [ "$is_set" = x ]; then
              echo "$name est reserve au pipeline et ne doit pas se trouver dans /ci, /runtime ou /backup." >&2
              exit 1
            fi
          done

      - name: Sauvegarder avant migration
        env:
          BACKUP_REASON: pre-deploy
          BACKUP_ALLOW_UNINITIALIZED: "true"
        run: |
          set -eu
          ./deployment/backup.sh

      - name: Deployer
        env:
          PIPELINE_DEPLOY_MODE: caddy
          PIPELINE_COMPOSE_WAIT_TIMEOUT: 240
        run: |
          set -eu
          ./deployment/deploy.sh

      - name: Sauvegarder l'etat deploye
        env:
          BACKUP_REASON: post-deploy
        run: |
          set -eu
          ./deployment/backup.sh

      - name: Remove the local credentials
        if: always()
        run: |
          docker logout >/dev/null 2>&1 || true
