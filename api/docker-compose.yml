name: lxp-api

services:
  db-pg:
    image: postgres:18-alpine
    container_name: lxp-prisma
    restart: unless-stopped
    ports:
      - "5500:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lxp}
    volumes:
      # PostgreSQL 18 stores its data in a major-version-specific subdirectory.
      - pg2:/var/lib/postgresql
    networks:
      - lxp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lxp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base dédiée au nouveau service ia-lxp.
  # Elle contient les vecteurs, sessions, mémoires et questions générées.
  db-ai:
    image: pgvector/pgvector:pg18
    container_name: lxp-ai-postgres
    restart: unless-stopped
    ports:
      - "5501:5432"
    environment:
      POSTGRES_USER: ${ANDRIA_POSTGRES_USER:-andria}
      POSTGRES_PASSWORD: ${ANDRIA_POSTGRES_PASSWORD:-andria}
      POSTGRES_DB: ${ANDRIA_POSTGRES_DB:-lxp_ai}
    volumes:
      # PostgreSQL 18 stores its data in a major-version-specific subdirectory.
      - pg_ai:/var/lib/postgresql
    networks:
      - lxp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ANDRIA_POSTGRES_USER:-andria} -d ${ANDRIA_POSTGRES_DB:-lxp_ai}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  db-mongo:
    image: mongo:8.2
    container_name: lxp-mongo
    restart: unless-stopped
    ports:
      - "27000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-lxp}
    volumes:
      - mongo2:/data/db
    networks:
      - lxp
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg2:
  pg_ai:
  mongo2:

networks:
  lxp:
    name: lxp
    driver: bridge
