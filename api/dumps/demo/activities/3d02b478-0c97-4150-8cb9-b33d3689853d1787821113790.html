<p>À la fin de cette leçon, l’apprenant doit être capable de :</p><ul><li><p>définir ce qu’est un standard d’accueil ;</p></li><li><p>expliquer son utilité ;</p></li><li><p>identifier les principaux domaines concernés par les standards ;</p></li><li><p>comprendre la différence entre standard, procédure et initiative personnelle.</p></li></ul><hr><h2></h2>
