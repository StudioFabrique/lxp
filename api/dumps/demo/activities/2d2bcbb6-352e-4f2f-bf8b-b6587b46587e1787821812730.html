<p>À la fin de cette leçon, l’apprenant doit être capable de :</p><ul><li><p>vérifier que la procédure a été correctement réalisée ;</p></li><li><p>repérer les principales erreurs d’accueil ;</p></li><li><p>contrôler la compréhension du client ;</p></li><li><p>identifier les points à améliorer dans sa propre pratique.</p></li></ul>
