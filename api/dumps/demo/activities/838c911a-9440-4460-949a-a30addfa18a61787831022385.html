<p>À la fin de cette leçon, l’apprenant doit être capable de :</p><ul><li><p>utiliser différents types de questions ;</p></li><li><p>recueillir les informations utiles ;</p></li><li><p>éviter les questions inutiles ou intrusives ;</p></li><li><p>structurer un échange permettant de comprendre la demande.</p></li></ul>
