<p>À la fin de cette leçon, l’apprenant doit être capable de :</p><ul><li><p>suivre les différentes étapes d’une procédure d’accueil ;</p></li><li><p>vérifier les informations nécessaires ;</p></li><li><p>éviter les oublis lors de la prise en charge ;</p></li><li><p>adapter la procédure à la situation du client.</p></li></ul>
